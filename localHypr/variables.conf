# ### Hyprland ###

# Main mod
$mainMod = Alt

# Apps
$terminal = kitty
$browser = brave
$editor = nvim
$fileExplorer = dolphin

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.8
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 5
$windowGapsIn = 5
$windowGapsOut = 5
$singleWindowGapsOut = 5

# Window styling
$windowOpacity = 0.95
$windowRounding = 15

$windowBorderSize = 1
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 5  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = $mainMod+Shift
$kbMoveWinToWsGroup = Ctrl+$mainMod+Shift
$kbGoToWs = $mainMod
$kbGoToWsGroup = Ctrl+$mainMod

$kbNextWs = Ctrl+$mainMod, right
$kbPrevWs = Ctrl+$mainMod, left

$kbToggleSpecialWs = $mainMod, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = $mainMod, U
$kbToggleGroup = $mainMod, Comma

# Window actions
$kbMoveWindow = $mainMod, Z
$kbResizeWindow = $mainMod, X
$kbWindowPip = $mainMod+Alt, Backslash
$kbPinWindow = $mainMod, P
$kbWindowFullscreen = $mainMod, F
$kbWindowBorderedFullscreen = $mainMod, F
$kbToggleWindowFloating = $mainMod, Space
$kbCloseWindow = $mainMod, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = $mainMod, M
$kbCommunication = $mainMod, D
$kbTodo = $mainMod + Shift, T

# Apps
$kbTerminal = $mainMod, T
$kbBrowser = $mainMod, B
$kbEditor = $mainMod, C
$kbFileExplorer = $mainMod, E

# Misc
$kbSession = Ctrl+Alt, Delete
$kbShowSidebar = $mainMod, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = $mainMod + Shift, P
$kbLock = Super + Shift, L
$kbRestoreLock = Super + Alt , L
$sunsetrToggle = $mainMod + W 
